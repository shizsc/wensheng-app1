<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B2A4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <title>文盛课程表</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 主内容区 -->
  <main id="app">
    <!-- 今日页面 -->
    <section id="page-today" class="page active">
      <div class="page-header">
        <h1>今日课程</h1>
        <p id="today-date" class="date-label"></p>
      </div>
      <div id="today-list" class="today-list"></div>
    </section>

    <!-- 课表页面 -->
    <section id="page-timetable" class="page">
      <div class="page-header">
        <h1>文盛课表</h1>
        <div class="week-selector">
          <button id="prev-week" class="week-btn">◀</button>
          <span id="current-week-label" class="week-label">第1周</span>
          <button id="next-week" class="week-btn">▶</button>
        </div>
      </div>
      <div class="timetable-wrapper">
        <div id="timetable-grid" class="timetable-grid"></div>
      </div>
    </section>

    <!-- 管理页面 -->
    <section id="page-manage" class="page">
      <div class="page-header">
        <h1>课程管理</h1>
        <div class="header-actions">
          <button id="btn-import" class="btn btn-primary">📥 导入Excel</button>
          <button id="btn-add" class="btn btn-secondary">+ 添加</button>
        </div>
      </div>
      <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none">
      <div id="course-list" class="course-list"></div>
    </section>

    <!-- 设置页面 -->
    <section id="page-settings" class="page">
      <div class="page-header">
        <h1>设置</h1>
      </div>
      <div class="settings-list">
        <div class="settings-item">
          <span>当前周次</span>
          <select id="setting-week" class="setting-select">
            <option value="1">第1周</option>
            <option value="2">第2周</option>
            <option value="3">第3周</option>
            <option value="4">第4周</option>
            <option value="5">第5周</option>
            <option value="6">第6周</option>
            <option value="7">第7周</option>
            <option value="8">第8周</option>
            <option value="9">第9周</option>
            <option value="10">第10周</option>
            <option value="11">第11周</option>
            <option value="12">第12周</option>
            <option value="13">第13周</option>
            <option value="14">第14周</option>
          </select>
        </div>
        <div class="settings-item" style="flex-direction:column;align-items:flex-start;gap:8px;">
          <span>模拟日期（用于查看指定日期的课程）</span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input type="date" id="setting-date" class="setting-select" style="flex:1;min-width:140px;">
            <span id="simulated-date-display" style="font-size:13px;color:var(--accent);display:none;"></span>
            <button id="btn-reset-date" class="btn btn-secondary" style="display:none;padding:6px 12px;font-size:13px;">恢复今天</button>
          </div>
        </div>
        <div class="settings-item">
          <span>课程提醒</span>
          <label class="switch">
            <input type="checkbox" id="setting-reminder">
            <span class="slider"></span>
          </label>
        </div>
        <div class="settings-item">
          <span>提醒提前时间</span>
          <select id="setting-remind-time" class="setting-select">
            <option value="5">5分钟</option>
            <option value="10" selected>10分钟</option>
            <option value="15">15分钟</option>
            <option value="30">30分钟</option>
          </select>
        </div>
        <div class="settings-item">
          <span>每日自动推送课程</span>
          <label class="switch">
            <input type="checkbox" id="setting-daily-reminder">
            <span class="slider"></span>
          </label>
        </div>
        <div class="settings-item">
          <span>推送时间</span>
          <select id="setting-daily-hour" class="setting-select">
            <option value="6">早上 6:00</option>
            <option value="7" selected>早上 7:00</option>
            <option value="8">早上 8:00</option>
            <option value="9">早上 9:00</option>
            <option value="18">晚上 18:00</option>
            <option value="21">晚上 21:00</option>
          </select>
        </div>
        <div class="settings-item">
          <span>立即测试推送</span>
          <button id="btn-test-notify" class="btn btn-secondary" style="padding:6px 12px;font-size:13px;">发送</button>
        </div>
        <div class="settings-item">
          <span>深色模式</span>
          <label class="switch">
            <input type="checkbox" id="setting-darkmode">
            <span class="slider"></span>
          </label>
        </div>
        <div class="settings-item">
          <span>强制刷新课程数据</span>
          <button id="btn-refresh-data" class="btn btn-secondary" style="padding:6px 12px;font-size:13px;">刷新</button>
        </div>
        <div class="settings-item danger">
          <span>清空所有课程</span>
          <button id="btn-clear-all" class="btn btn-danger">清空</button>
        </div>
        <div class="settings-item" style="flex-direction:column;align-items:flex-start;gap:8px;">
          <span>📱 添加到手机桌面</span>
          <div style="font-size:13px;color:var(--neutral-600);line-height:1.6;">
            <strong>iPhone（Safari）：</strong>点击底部「分享」→「添加到主屏幕」<br>
            <strong>Android（Chrome）：</strong>点击右上角「⋮」→「添加到主屏幕」
          </div>
        </div>
        <div class="settings-item">
          <span>检查更新</span>
          <button id="btn-check-update" class="btn btn-secondary" style="padding:6px 12px;font-size:13px;">检查</button>
        </div>
        <div class="settings-item">
          <span>关于</span>
          <span class="setting-value" id="version-display">文盛课程表 v1.2 · WENSHENGEDUCATION</span>
        </div>
      </div>
    </section>
  </main>

  <!-- 底部导航 -->
  <nav class="tab-bar">
    <button class="tab-item active" data-page="today">
      <span class="tab-icon">📅</span>
      <span class="tab-label">今日</span>
    </button>
    <button class="tab-item" data-page="timetable">
      <span class="tab-icon">📋</span>
      <span class="tab-label">课表</span>
    </button>
    <button class="tab-item" data-page="manage">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">管理</span>
    </button>
    <button class="tab-item" data-page="settings">
      <span class="tab-icon">🔧</span>
      <span class="tab-label">设置</span>
    </button>
  </nav>

  <!-- 添加/编辑课程弹窗 -->
  <div id="modal-course" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">添加课程</h2>
      <form id="course-form">
        <input type="hidden" id="f-id">
        <div class="form-group">
          <label>课程名称 *</label>
          <input type="text" id="f-name" required placeholder="如：英语-1">
        </div>
        <div class="form-group">
          <label>星期 *</label>
          <select id="f-day" required>
            <option value="周一">周一</option>
            <option value="周二">周二</option>
            <option value="周三">周三</option>
            <option value="周四">周四</option>
            <option value="周五">周五</option>
            <option value="周六">周六</option>
            <option value="周日">周日</option>
          </select>
        </div>
        <div class="form-group">
          <label>具体时间 *</label>
          <input type="text" id="f-time" required placeholder="如：13:40-16:40">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>开始节数 *</label>
            <input type="number" id="f-start" min="1" max="11" required placeholder="5">
          </div>
          <div class="form-group">
            <label>结束节数 *</label>
            <input type="number" id="f-end" min="1" max="11" required placeholder="8">
          </div>
        </div>
        <div class="form-group">
          <label>老师</label>
          <input type="text" id="f-teacher" placeholder="如：耿老师">
        </div>
        <div class="form-group">
          <label>地点</label>
          <input type="text" id="f-location" placeholder="如：505教室">
        </div>
        <div class="form-group">
          <label>周数 *</label>
          <select id="f-week" required>
            <option value="1">第1周</option>
            <option value="2">第2周</option>
            <option value="3">第3周</option>
            <option value="4">第4周</option>
            <option value="5">第5周</option>
            <option value="6">第6周</option>
            <option value="7">第7周</option>
            <option value="8">第8周</option>
            <option value="9">第9周</option>
            <option value="10">第10周</option>
            <option value="11">第11周</option>
            <option value="12">第12周</option>
            <option value="13">第13周</option>
            <option value="14">第14周</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 提示消息 -->
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
